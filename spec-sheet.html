<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Specification Sheet</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet"><style>body,body *,body input,body textarea,body button{font-family:"Noto Sans KR","Malgun Gothic",sans-serif!important}body{display:block;height:auto;overflow:auto;background:#cfd7df;margin:0;font-family:Arial,"Malgun Gothic",sans-serif;color:#15253a}
.toolbar{position:sticky;top:0;z-index:9;background:#005596;padding:10px 20px;color:#fff;display:flex;gap:10px;align-items:center}
.toolbar img{height:34px;max-width:190px;object-fit:contain;background:#fff;padding:4px}.toolbar span{font-weight:bold;letter-spacing:1px}.toolbar .section-options{display:flex;gap:10px;align-items:center;font-size:11px;font-weight:400;letter-spacing:0}.toolbar .section-options label{display:flex;gap:4px;align-items:center;cursor:pointer;white-space:nowrap}.toolbar .section-options input{margin:0}.toolbar i{flex:1}
.btn{border:0;background:#fff;color:#005596;border-radius:3px;padding:9px 14px;font-weight:bold;cursor:pointer}.btn.main{background:#64748b;color:#fff}
.page{width:210mm;min-height:297mm;margin:12px auto;background:#fff;box-shadow:0 2px 12px #0004;padding:14mm 14mm 12mm;position:relative;page-break-after:always}
.page-head{height:31mm;border-bottom:2px solid #005596;display:grid;grid-template-columns:1fr 55mm;grid-template-rows:14mm 16mm;column-gap:3mm;align-items:stretch;overflow:hidden}
.page-head>*{min-width:0;box-sizing:border-box}
.page-head img{grid-column:1;grid-row:1;height:14mm;width:auto;max-width:84mm;object-fit:contain;object-position:left top;align-self:start}
.sheet-title{grid-column:1;grid-row:2;position:relative;isolation:isolate;overflow:hidden;text-align:center;font-weight:800;color:#fff;background:linear-gradient(105deg,#00396b 0%,#005b9c 48%,#0876b7 100%);padding:1.2mm 3mm;display:flex;align-items:center;justify-content:center}
.sheet-title::before{content:"";position:absolute;z-index:-1;left:-9%;top:-145%;width:72%;height:390%;pointer-events:none;opacity:.25;filter:blur(1.4px);transform:rotate(-14deg);background:repeating-radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.80) 0 2px,rgba(255,255,255,.20) 3px 7px,transparent 8px 14px);border-radius:50%}
.sheet-title::after{content:"";position:absolute;z-index:-1;right:-13%;bottom:-120%;width:75%;height:355%;pointer-events:none;opacity:.18;filter:blur(2px);transform:rotate(18deg);background:repeating-radial-gradient(ellipse at 50% 50%,rgba(206,238,255,.9) 0 2px,rgba(255,255,255,.18) 3px 8px,transparent 9px 16px);border-radius:50%}
.title-lines{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#fff}
.title-main{font:800 8.5px/1 Arial,"Malgun Gothic",sans-serif;letter-spacing:1.25px}
.title-product{box-sizing:border-box;width:100%;min-width:0;border:0!important;outline:0!important;box-shadow:none!important;appearance:none!important;text-align:center;color:#fff!important;font:800 16px/1.04 Arial,"Malgun Gothic",sans-serif;background:transparent!important;padding:1px 0!important;margin:1px 0!important}
.title-sub{font:400 6.8px/1 Arial,"Malgun Gothic",sans-serif;letter-spacing:.15px;opacity:.92}
.doc-meta{grid-column:2;grid-row:2;font-size:11px;width:55mm;height:16mm;align-self:stretch;overflow:hidden}.doc-meta div{box-sizing:border-box;height:4mm;display:grid;grid-template-columns:19mm minmax(0,1fr);align-items:center;border-bottom:1px solid #b9c6d1;padding:0}.doc-meta b{color:#005596;white-space:nowrap}.doc-meta input{width:100%;min-width:0;border:0!important;outline:0!important;box-shadow:none!important;appearance:none!important;border-radius:0!important;font-size:11px;font-weight:700;text-align:left;background:transparent!important;padding:0}
.sub-title{font-weight:800;color:#064f86;font-size:14px;margin:6mm 0 3mm;border-left:5px solid #005596;border-bottom:1px solid #c8d9e7;background:#f1f7fb;padding:1.7mm 2.8mm;letter-spacing:.01em}
.sub-title.minor{font-size:12px;margin-top:4mm;margin-bottom:2mm;background:#f8fbfd}
.revtable,.sheet-table{border-collapse:collapse;width:100%;font-size:10px}.revtable th,.sheet-table th{background:#dceaf7;color:#111827;border:1px solid #9db8d0;padding:4px;font-weight:700}.revtable td,.sheet-table td{border:1px solid #b9c6d1;padding:3px;vertical-align:middle}.revtable input{box-sizing:border-box;border:0!important;width:100%;font-size:10px;font-weight:700;text-align:center;background:transparent!important;color:#15253a;outline:0!important}
.add-row{font-size:10px;margin:3px 0;padding:4px 7px;border:1px solid #005596;background:white;color:#005596;cursor:pointer}
.cable-info-layout{display:grid;grid-template-columns:48% 1fr;gap:7mm;margin-top:1mm;align-items:stretch}.visuals{display:flex;flex-direction:column;gap:3mm}.visual-cell{min-width:0}.visual-title{font-size:10px;font-weight:800;line-height:11.5px;height:11.5px;color:#075985;margin-bottom:1mm;letter-spacing:.02em}.drawing{box-sizing:border-box;width:100%;border:1px solid #8fa8bd;height:47mm;padding:3mm;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}.drawing img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.drawing-note{font-size:8px;line-height:9.2px;color:#4b5e70;margin-top:1mm;text-align:left}.empty{padding:15px;color:#64748b}
.cable-details{background:#edf7f6;padding:4mm;margin-top:calc(11.5px + 1mm);margin-bottom:calc(9.2px + 1mm);align-self:stretch}.field-grid{display:grid;grid-template-columns:1fr;gap:3mm}.field label,.wide-field label{font-size:10px;font-weight:800;color:#075985;display:block;margin-bottom:1px;letter-spacing:.01em}.field.inline-field{display:grid;grid-template-columns:minmax(46mm,58%) minmax(0,1fr);column-gap:2.5mm;align-items:center}.field.inline-field label{margin:0;white-space:nowrap}.field.inline-field input{min-width:0}.field input,.wide-field textarea{box-sizing:border-box;width:100%;border:0!important;border-bottom:1px solid #9cb7bb!important;padding:2px 0;font:800 11px Arial;background:transparent!important;color:#0b3557;outline:0!important;min-height:22px;border-radius:0!important;box-shadow:none!important}.field input:focus,.wide-field textarea:focus,.doc-meta input:focus,.revtable input:focus{border-bottom-color:#005596!important;outline:0!important}
.wide-field{margin-top:3mm}.split-bullets{display:grid;grid-template-columns:1fr;gap:2mm}.split-bullets textarea{min-height:31px;height:31px;resize:none}.wide-field textarea{resize:vertical;white-space:pre-wrap}.field input::placeholder,.wide-field textarea::placeholder{color:#98a9b8;font-weight:400}
.cable-details .field input,.cable-details .wide-field textarea,.identification-grid .wide-field textarea,.marking-field .wide-field textarea{margin-left:3mm;width:calc(100% - 3mm)}
.cable-details .field.inline-field input{margin-left:0;width:100%;text-align:left;font-weight:800}
.marking-field textarea{border-bottom:0!important}
.prefixed-input{display:flex;align-items:flex-start;gap:2mm;margin-left:3mm;width:calc(100% - 3mm)}
.prefixed-input .input-prefix{padding-top:2px;font:800 11px Arial;color:#0b3557;white-space:nowrap}
.marking-field .prefixed-input textarea{margin-left:0;width:100%;font-weight:800}
.identification-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7mm}.identification-grid textarea{height:28px;min-height:28px;resize:none}.identification-grid>div:first-child textarea{resize:vertical}.marking-field textarea{height:32px;min-height:32px;resize:none}
.sheet-table{table-layout:fixed;font-size:8.5px}.sheet-table td{text-align:center;word-break:break-word}.sheet-table th{font-size:8px;line-height:1.15}.sheet-table tr:nth-child(even) td{background:#f6f9fb}.page-no{font-weight:bold;color:#005596;font-size:11px}.page-footer{position:absolute;left:14mm;right:14mm;bottom:10mm;border-top:1px solid #d7e0e8;padding-top:2mm;font-size:7.5px;line-height:1.25;color:#a0aeba;text-align:center}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.toolbar,.add-row{display:none}body{background:#fff}.page{margin:0;box-shadow:none;break-after:page}.page:last-child{break-after:auto}@page{size:A4 portrait;margin:0}}</style></head><body><div class="toolbar"><img src="assets/ls-cable-logo.png"><span>Specification Sheet</span><span class="section-options"><label title="사양서 부표 출력"><input id="includeDimensionSection" type="checkbox" checked> 사양서 부표</label><label title="Technical Data 출력"><input id="includeTechSection" type="checkbox" checked> TECH DATA</label></span><i></i><button class="btn" onclick="addCurrentSpecToFullSpec()">FULL SPEC에 추가</button><button class="btn" onclick="exportStandaloneHtml()">Save</button><button class="btn" onclick="window.print()">Print / PDF</button><button class="btn main" onclick="goMain()">메인화면 가기</button></div><main id="pages"></main><script src="full-spec-storage.js?v=20260723-2"></script><script src="spec-sheet.js"></script><script src="full-spec-collector.js?v=20260723-2"></script></body></html>
