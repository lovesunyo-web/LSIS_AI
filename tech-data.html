<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technical Data</title><link rel="stylesheet" href="style.css">
<style>
body{display:block;height:auto;overflow:auto;background:#e9eff5;font-family:Arial,"Malgun Gothic",sans-serif;color:#172b4d;margin:0}.topbar{height:76px;background:#005596;display:flex;align-items:center;gap:22px;padding:0 26px;color:#fff;box-shadow:0 2px 8px #0002}.logo{background:#fff;padding:7px 10px;height:46px;max-width:190px;object-fit:contain}.topbar h1{font-size:19px;letter-spacing:1.4px;margin:0}.topbar small{color:#d8ecff}.spacer{flex:1}.btn{border:0;border-radius:3px;padding:9px 14px;font-weight:bold;cursor:pointer;background:#fff;color:#004f8c}.btn.copy-image,.btn.copy-excel,.btn.gray{background:#64748b;color:#fff}.btn.spec{background:#2563eb;color:#fff}.wrap{max-width:1600px;margin:12px auto;padding:0 12px}.card{background:#fff;border:1px solid #d9e1ea;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px #14365d0d}.section-title{border-left:4px solid #e6384f;padding-left:8px;font-size:15px;font-weight:800;letter-spacing:.3px;margin-bottom:8px}.condition-groups{display:flex;flex-direction:column;gap:8px;overflow-x:auto}.condition-row{display:flex;align-items:flex-end;gap:10px;padding:2px 0}.condition-row-title{width:82px;min-width:82px;padding:0 3px 7px 0;font-size:13px;font-weight:900;color:#075985}.condition-row.dc-ir{display:grid;grid-template-columns:82px minmax(360px,1.35fr) 28px 82px minmax(280px,1fr);align-items:end}.condition-row.amp{display:grid;grid-template-columns:82px repeat(7,minmax(125px,1fr));align-items:end}.condition-field{min-width:0}.condition-field.wide{min-width:0}.condition-spacer{width:26px}.condition-row-title.emphasis{color:#075985}.condition-footer{margin-top:12px;padding-top:4px}.notice{font-size:15px;color:#dc2626;font-weight:900;margin:0;text-align:center;line-height:1.6;letter-spacing:.15px}label{font-size:11px;font-weight:bold;display:block;color:#3a506b;margin-bottom:3px;white-space:nowrap}select,input,textarea{box-sizing:border-box;border:1px solid #b9c7d6;padding:6px;width:100%;font-size:12px;font-weight:700;background:#fff4e8;color:#172b4d;height:29px}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}th{background:#dceaf7;color:#111827;padding:3px 2px;border:1px solid #9db8d0}td{border:1px solid #cbd5df;padding:1px 2px!important;height:20px!important;vertical-align:middle;text-align:center}tr:nth-child(even){background:#f5f8fb}.num{text-align:right;height:18px!important;min-height:18px!important;padding:1px 2px!important;border:0!important;background:#fff4e8!important;font-size:11px!important;font-weight:700!important}.tech-head{display:flex;align-items:center;gap:4px;justify-content:center;color:#111827;margin:0;font-size:10px;line-height:1.15;text-align:center}.tech-head input{width:auto;height:auto;margin:0;accent-color:#005596}.tech-head-text{display:inline-block;text-align:center;white-space:normal;overflow-wrap:anywhere;word-break:keep-all}.tech-head-unit{display:block;text-align:center;font-weight:700}.tech-row-selector{width:24px!important;min-width:24px!important;padding:0!important;text-align:center!important;border-right:0!important}.tech-row-selector input{width:14px!important;height:14px!important;margin:0!important;vertical-align:middle}.empty{padding:25px;color:#64748b}@media(max-width:900px){.wrap{padding:0 6px}.card{padding:8px}.topbar{gap:8px;padding:0 10px}.topbar small{display:none}}@media print{.topbar,.condition-footer{display:none}body{background:#fff}.wrap{max-width:none;margin:0;padding:0}.card{border:0;box-shadow:none;padding:0}.card:first-child{display:none}}
</style></head>
<body><header class="topbar"><img class="logo" src="assets/ls-cable-logo.png" alt="LS Cable & System"><h1>Technical Data</h1><small>Selected confirmed specification rows are linked automatically</small><span class="spacer"></span><button class="btn copy-image" onclick="copySelectedTechAsImage()">선택복사</button><button class="btn copy-excel" onclick="copyTechTableToExcel()">엑셀복사</button><button class="btn spec" onclick="openSpecSheet()">SPEC</button><button class="btn gray" onclick="goMain()">메인화면 가기</button></header>
<main class="wrap"><section class="card"><div class="section-title">Calculation Condition</div><div class="condition-groups">
<div class="condition-row dc-ir"><div class="condition-row-title emphasis">도체저항</div>
<div class="condition-fields" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px"><div class="condition-field"><label>적용 표준</label><select id="dcStandard"><option value="AUTO">자동</option><option value="IEC_60228">IEC 60228</option><option value="NEMA_WC70">ASTM / NEMA WC 70 / ICEA</option><option value="IEEE_1580">IEEE 1580</option></select></div><div class="condition-field"><label>도체 구조 / Class</label><select id="dcClass"></select></div><div class="condition-field"><label>도금여부</label><select id="dcCoating"><option value="AUTO">자동</option><option value="PLAIN">나동</option><option value="TINNED">주석도금</option></select></div></div>
<div class="condition-spacer"></div><div class="condition-row-title emphasis">절연저항</div>
<div class="condition-fields" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><div class="condition-field"><label>적용 표준</label><select id="irStandard"><option value="AUTO">자동</option><option value="IEC_PROJECT">IEC (K=3670, 20°C)</option><option value="NEMA_WC70">NEMA WC 70 / ICEA</option><option value="IEEE_1580">IEEE 1580</option></select></div><div class="condition-field"><label>K값 그룹</label><select id="irGroup"><option value="AUTO">절연재질 자동</option><option value="610">K 610</option><option value="914.4">K 914.4</option><option value="1220">K 1,220</option><option value="3050">K 3,050</option><option value="3670">K 3,670</option><option value="6100">K 6,100</option><option value="12192">K 12,192</option><option value="15240">K 15,240</option></select></div></div><div></div></div>
<div class="condition-row amp"><div class="condition-row-title emphasis">허용전류</div>
<div class="condition-field"><label>도체 온도</label><select id="condTemp"><option value="70">70 °C</option><option value="90" selected>90 °C</option><option value="105">105 °C</option></select></div><div class="condition-field"><label>포설 조건</label><select id="install"><option>In air</option><option>On cable tray</option><option>In conduit</option><option>Buried</option></select></div><div class="condition-field"><label>주위 온도</label><select id="ambient"><option value="25">25 °C</option><option value="30" selected>30 °C</option><option value="40">40 °C</option><option value="45">45 °C</option><option value="50">50 °C</option><option value="55">55 °C</option><option value="60">60 °C</option><option value="65">65 °C</option><option value="70">70 °C</option><option value="75">75 °C</option><option value="80">80 °C</option></select></div><div class="condition-field"><label>회로 그룹</label><select id="grouping"><option value="1">Single circuit</option><option value=".9">2 circuits</option><option value=".8">3 circuits</option><option value=".7">4+ circuits</option></select></div><div class="condition-field"><label>이격 조건</label><select id="spacing"><option value="1">Separated</option><option value=".9">Touching</option></select></div><div class="condition-field"><label>주파수</label><select id="frequency"><option value="50">50 Hz</option><option value="60" selected>60 Hz</option></select></div><div class="condition-field"><label>접지 / Shield</label><select id="earth"><option>Grounded shield</option><option>Ungrounded shield</option><option>No shield</option></select></div></div>
</div><div class="condition-footer"><p class="notice">TECH DATA는 반드시 검증한 후 사용하시기 바랍니다.</p></div></section>
<section class="card"><div class="section-title">Technical Data By Dimension Table Row</div><div id="tableArea"></div></section></main>
