<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사양서부표</title>
    <link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        html,body,body *,input,select,textarea,button{font-family:"Noto Sans KR","Malgun Gothic",sans-serif!important;}
        body {
            background-color: #f1f5f9;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
            height: auto;
            overflow-y: auto;
        }
        .spec-container {
            max-width: 1880px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .info-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 16px 20px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 12px rgba(15,23,42,0.04);
        }
        .info-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
            border-left: 4px solid #2563eb;
            padding-left: 8px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .info-item {
            font-size: 12px;
            color: #475569;
        }
        .info-item span {
            font-weight: 700;
            color: #0f172a;
        }
        .control-panel {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 12px rgba(15,23,42,0.04);
        }
        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            align-items: flex-end;
        }
        .btn-action {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-action:hover {
            background-color: #1d4ed8;
        }
        .btn-secondary {
            background-color: #10b981;
        }
        .btn-secondary:hover {
            background-color: #059669;
        }
        .btn-purple {
            background-color: #7c3aed;
        }
        .btn-purple:hover {
            background-color: #6d28d9;
        }
        .btn-red {
            background-color: #ef4444;
        }
        .btn-red:hover {
            background-color: #dc2626;
        }
        .checkbox-scroll-box {
            border: 1.5px solid #cbd5e1;
            border-radius: 4px;
            height: 120px;
            overflow-y: auto;
            padding: 8px;
            background: #f8fafc;
        }
        .checkbox-scroll-box label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 600;
            margin-bottom: 4px;
            cursor: pointer;
        }
        .catalog-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 24px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 12px rgba(15,23,42,0.04);
        }
        .catalog-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            table-layout: fixed;
            border: 1.5px solid #0f172a;
        }
        
        /* [3-2단계 수정] 사양서 부표의 행 높이도 절반(padding 축소 및 height 20px)으로 완전 밀착 수정 */
        .catalog-table th, .catalog-table td {
            border: 1px solid #cbd5e1;
            padding: 3px 2px !important;
            vertical-align: middle;
            text-align: center;
            word-break: break-all;
        }
        .catalog-table th {
            background-color: #1e293b;
            color: #ffffff;
            font-weight: 700;
            font-size: 11px;
            border: 1px solid #475569;
        }
        .catalog-table td {
            font-weight: 500;
            color: #334155;
            background: #ffffff;
            height: 20px !important;
        }
        .catalog-table tr:nth-child(even) td {
            background-color: #f8fafc;
        }
        .catalog-table td input {
            width: 100%;
            border: none;
            background: transparent;
            text-align: right;
            font-size: 11px;
            font-weight: 700;
            color: #0f172a;
            outline: none;
            padding: 1px 2px !important;
            border-radius: 4px;
            height: 18px !important;
        }
        .catalog-table td input:focus {
            background-color: #e2e8f0;
        }
        .col-num {
            text-align: right !important;
            font-weight: 700;
            padding-right: 10px !important;
        }
        .col-bold {
            font-weight: 700 !important;
            color: #0f172a !important;
        }
        .control-group-box {
            border: 2px solid #2563eb;
            background-color: #eff6ff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
    </style>
</head>
<body>

<div class="spec-container">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #cbd5e1; padding-bottom: 12px;">
        <h1 style="font-size: 24px; font-weight: 700; color: #0f172a;" id="pageMainTitle">전선 일괄 규격 부표 생성기 (Specification Table Generator)</h1>
        <div style="display:flex; gap:8px;">
        <button class="btn-action btn-purple" type="button" onclick="openTechDataPage()">TECH DATA</button>
        <button class="btn-action" style="background-color: #64748b;" onclick="goBackToMain()">메인화면 가기</button>
    </div>
    </div>

    <!-- 상속 옵션 정보 -->
    <div class="info-card inherited-config-panel">
        <div class="info-grid" id="configDisplay"></div>
    </div>

    <!-- 입력형 제어 패널 -->
    <div class="control-panel" id="inputControlPanel">
        <div class="control-grid">
            
            <div class="field-group" style="margin-bottom:0;">
                <label style="font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px;">두께 적용 기준</label>
                <select id="thickness_rule_mode_spec" onchange="if(typeof guardedGenerateSpecTable==='function') guardedGenerateSpecTable(); else if(typeof generateSpecTable==='function') generateSpecTable();" style="height:36px; padding:6px; font-size:13px; font-weight:700; border-radius:6px; border:1.5px solid #cbd5e1; outline:none;"></select>
            </div>

            <div class="field-group" style="margin-bottom:0;">
                <label style="font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px;" id="core_input_label">선심수 리스트 / 범위 (쉼표 또는 ~로 구분)</label>
                <input type="text" id="core_list_input" value="1~5,7,10" style="height: 36px; padding:6px; font-size:13px; font-weight:700; border-radius:6px; border:1.5px solid #cbd5e1; outline:none;" placeholder="예: 1~5 또는 1,2,3,5,10">
            </div>

            <div class="field-group" style="margin-bottom:0;">
                <label style="font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px;">도체 규격 개별 멀티 선택</label>
                <div class="checkbox-scroll-box" id="size_checkbox_container">
                    <!-- JS 로드된 도체 규격 checkbox 바인딩 -->
                </div>
            </div>

            <!-- [3-2단계 신규] 부표 작성 옆에 초기화 리셋 버튼 탑재 완료 -->
            <div class="field-group" style="margin-bottom:0; display:flex; flex-direction:row; gap:6px;">
                <button class="btn-action" style="flex:1; height: 36px;" onclick="if(typeof guardedGenerateSpecTable==='function') guardedGenerateSpecTable(); else generateSpecTable();">부표 일괄 작성</button>
                <button class="btn-action btn-secondary" style="width: 132px; min-width:132px; height: 36px; white-space:nowrap;" onclick="if(typeof recalculateTable==='function') recalculateTable();">수정값 재계산</button>
                <button class="btn-action btn-red" style="width: 118px; min-width:118px; height: 36px; white-space:nowrap;" onclick="if(typeof guardedClearSpecTable==='function') guardedClearSpecTable(); else clearSpecTable();">초기화</button>
            </div>
        </div>
    </div>

    <!-- 출력 사양서 및 상단 제어 박스 -->
    <div class="catalog-card" id="catalogCard" style="display: none;">
        <table class="catalog-table" id="specTable">
            <thead>
                <tr>
                    <th data-col-idx="0" id="coresPairsHeader" style="width:7.69%;"><div class="spec-header-cell"><span class="h-main">No. of</span><span class="h-sub">Cores</span><span class="h-unit"></span></div></th>
                    <th data-col-idx="1" id="condSizeHeader" style="width:7.69%;"><div class="spec-header-cell"><span class="h-main">Cond.</span><span class="h-sub">Size</span><span class="h-unit">(SQMM)</span></div></th>
                    <th data-col-idx="2" style="width:7.69%;"><div class="spec-header-cell"><span class="h-main">Cond.</span><span class="h-sub">O.D.</span><span class="h-unit">(mm)</span></div></th>
                    <th data-col-idx="3" style="width:7.69%;"><div class="spec-header-cell"><span class="h-main">Insulation</span><span class="h-sub">Thick.</span><span class="h-unit">(mm)</span></div></th>
                    <th data-col-idx="4" style="width:7.69%;"><div class="spec-header-cell"><span class="h-main">Assembly</span><span class="h-sub">O.D.</span><span class="h-unit">(mm)</span></div></th>
                    <th data-col-idx="5" style="width:7.69%;"><div class="spec-header-cell"><span class="h-main">Inner Covering</span><span class="h-sub">Thick.</span><span class="h-unit">(mm)</span></div></th>
                    <th data-col-idx="6" style="width:7.69%;"><div class="spec-header-cell"><span class="h-main">Inner Sheath</span><span class="h-sub">O.D.</span><span class="h-unit">(mm)</span></div></th>
                    <th data-col-idx="7" style="width:7.69%;"><div class="spec-header-cell"><span class="h-main">Armor Wire</span><span class="h-sub">Dia./Tape</span><span class="h-unit">(mm)</span></div></th>
                    <th data-col-idx="8" style="width:7.69%;"><div class="spec-header-cell"><span class="h-main">Outer Sheath</span><span class="h-sub">Thick.</span><span class="h-unit">(mm)</span></div></th>
                    <th data-col-idx="9" style="width:7.69%;"><div class="spec-header-cell"><span class="h-main">Overall</span><span class="h-sub">O.D.</span><span class="h-unit">(mm)</span></div></th>
                    <th data-col-idx="10" style="width:7.69%;"><div class="spec-header-cell"><span class="h-main">O.D</span><span class="h-sub">±</span><span class="h-unit">(mm)</span></div></th>
                    <th data-col-idx="11" style="width:7.69%;"><div class="spec-header-cell"><span class="h-main">Approx.</span><span class="h-sub">Weight</span><span class="h-unit">(kg/km)</span></div></th>
                    <th data-col-idx="12" style="width:7.69%; background-color:#1e3a8a !important; border:1px solid #2563eb;"><div class="spec-header-cell"><span class="h-main">재료비</span><span class="h-sub">Material Cost</span><span class="h-unit">(원/m)</span></div></th>
                </tr>
            </thead>
            <tbody id="specTableBody"></tbody>
        </table>
    </div>
</div>

<script src="db.js?v=20260723-ieee-classk"></script>
<script src="conductor-db.js?v=20260723-ieee-classk"></script>
<script src="conductor-utils.js?v=20260723-ieee-classk"></script>
<script src="shared-material-engine.js?v=20260911-stability-1"></script>
<script src="app2.js?v=20260723-ieee-classk"></script>
</body>
</html>
